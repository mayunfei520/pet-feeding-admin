server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:pet_feeding}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USERNAME:petfeeder}
    password: ${MYSQL_PASSWORD:PetFeeding2024!}
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400

# ========== 微信小程序配置 ==========
wx:
  miniapp:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}

# 国密 SM4 密钥（16 字节 hex），生产环境由 docker-compose 环境变量 SM4_KEY 注入
sm4:
  key: ${SM4_KEY:}