# ========== 开发环境配置 ==========
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/pet_feeding;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:h2:file:./data/pet_feeding;DB_CLOSE_DELAY=-1;MODE=MySQL
    user: sa
    password:
  h2:
    console:
      enabled: true

# ========== JWT 配置 ==========
jwt:
  secret: pet-feeding-platform-secret-key-2024
  expiration: 86400

# ========== 微信小程序配置 ==========
wx:
  miniapp:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}

# ========== MyBatis-Plus 日志 ==========
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto